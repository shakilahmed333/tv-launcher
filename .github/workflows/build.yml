name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest launcher.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}" \
            --prerelease
